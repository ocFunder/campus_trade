<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的商品 - 校园二手交易平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-recycle me-2"></i>校园二手交易
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">商品浏览</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="publish.html">发布商品</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item" id="loginNav" style="display: none;">
                        <a class="nav-link" href="login.html">登录</a>
                    </li>
                    <li class="nav-item" id="registerNav" style="display: none;">
                        <a class="nav-link" href="register.html">注册</a>
                    </li>
                    <li class="nav-item dropdown" id="userNav" style="display: none;">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user me-1"></i><span id="username"></span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="profile.html">个人中心</a></li>
                            <li><a class="dropdown-item" href="my-products.html">我的商品</a></li>
                            <li><a class="dropdown-item" href="my-orders.html">我的订单</a></li>
                            <li><a class="dropdown-item" href="reviews.html">我的评价</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <div class="container mt-4">
        <div class="row">
            <!-- 侧边栏 -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-user me-2"></i>个人中心</h5>
                    </div>
                    <div class="list-group list-group-flush">
                        <a href="profile.html" class="list-group-item list-group-item-action">
                            <i class="fas fa-user me-2"></i>基本信息
                        </a>
                        <a href="my-products.html" class="list-group-item list-group-item-action active">
                            <i class="fas fa-box me-2"></i>我的商品
                        </a>
                        <a href="my-orders.html" class="list-group-item list-group-item-action">
                            <i class="fas fa-shopping-cart me-2"></i>我的订单
                        </a>
                        <a href="#" class="list-group-item list-group-item-action" onclick="logout()">
                            <i class="fas fa-sign-out-alt me-2"></i>退出登录
                        </a>
                    </div>
                </div>
            </div>

            <!-- 主内容区 -->
            <div class="col-md-9">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-box me-2"></i>我的商品</h5>
                        <a href="publish.html" class="btn btn-primary btn-sm">
                            <i class="fas fa-plus me-1"></i>发布商品
                        </a>
                    </div>
                    <div class="card-body">
                        <!-- 筛选器 -->
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <select class="form-select" id="statusFilter">
                                    <option value="">全部状态</option>
                                    <option value="ACTIVE">在售</option>
                                    <option value="SOLD">已售</option>
                                    <option value="RESERVED">预订</option>
                                    <option value="DELETED">已删除</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <select class="form-select" id="categoryFilter">
                                    <option value="">全部分类</option>
                                    <option value="ELECTRONICS">电子产品</option>
                                    <option value="BOOKS">图书教材</option>
                                    <option value="CLOTHING">服装配饰</option>
                                    <option value="SPORTS">运动用品</option>
                                    <option value="DAILY">生活用品</option>
                                    <option value="STUDY">学习用品</option>
                                    <option value="BEAUTY">美妆护肤</option>
                                    <option value="FOOD">食品饮料</option>
                                    <option value="OTHER">其他</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-outline-primary w-100" onclick="loadMyProducts()">
                                    <i class="fas fa-search me-1"></i>筛选
                                </button>
                            </div>
                        </div>

                        <!-- 商品列表 -->
                        <div class="row" id="productsContainer">
                            <!-- 商品将通过JavaScript动态加载 -->
                        </div>
                        
                        <!-- 分页 -->
                        <nav aria-label="商品分页" class="mt-4">
                            <ul class="pagination justify-content-center" id="pagination">
                                <!-- 分页按钮将通过JavaScript动态生成 -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>校园二手交易平台</h5>
                    <p class="mb-0">让闲置物品重新焕发生机，让校园生活更加环保便捷。</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="mb-0">&copy; 2023 校园二手交易平台. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- 编辑商品模态框 -->
    <div class="modal fade" id="editProductModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">编辑商品</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editProductForm">
                        <input type="hidden" id="editProductId">
                        <div class="mb-3">
                            <label for="editTitle" class="form-label">商品标题</label>
                            <input type="text" class="form-control" id="editTitle" required>
                        </div>
                        <div class="mb-3">
                            <label for="editDescription" class="form-label">商品描述</label>
                            <textarea class="form-control" id="editDescription" rows="3" required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="editPrice" class="form-label">价格</label>
                                    <input type="number" class="form-control" id="editPrice" step="0.01" min="0" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="editCategory" class="form-label">分类</label>
                                    <select class="form-select" id="editCategory" required>
                                        <option value="ELECTRONICS">电子产品</option>
                                        <option value="BOOKS">图书教材</option>
                                        <option value="CLOTHING">服装配饰</option>
                                        <option value="SPORTS">运动用品</option>
                                        <option value="DAILY">生活用品</option>
                                        <option value="STUDY">学习用品</option>
                                        <option value="BEAUTY">美妆护肤</option>
                                        <option value="FOOD">食品饮料</option>
                                        <option value="OTHER">其他</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="editImages" class="form-label">图片URL（多个用逗号分隔）</label>
                            <input type="text" class="form-control" id="editImages" placeholder="https://example.com/image1.jpg,https://example.com/image2.jpg">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="updateProduct()">保存修改</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/my-products.js"></script>
</body>
</html>
