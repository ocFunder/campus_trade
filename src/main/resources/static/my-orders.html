<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 校园二手交易平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-recycle me-2"></i>校园二手交易
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">商品浏览</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="publish.html">发布商品</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item" id="loginNav" style="display: none;">
                        <a class="nav-link" href="login.html">登录</a>
                    </li>
                    <li class="nav-item" id="registerNav" style="display: none;">
                        <a class="nav-link" href="register.html">注册</a>
                    </li>
                    <li class="nav-item dropdown" id="userNav" style="display: none;">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user me-1"></i><span id="username"></span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="profile.html">个人中心</a></li>
                            <li><a class="dropdown-item" href="my-products.html">我的商品</a></li>
                            <li><a class="dropdown-item" href="my-orders.html">我的订单</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <div class="container mt-4">
        <div class="row">
            <!-- 侧边栏 -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-user me-2"></i>个人中心</h5>
                    </div>
                    <div class="list-group list-group-flush">
                        <a href="profile.html" class="list-group-item list-group-item-action">
                            <i class="fas fa-user me-2"></i>基本信息
                        </a>
                        <a href="my-products.html" class="list-group-item list-group-item-action">
                            <i class="fas fa-box me-2"></i>我的商品
                        </a>
                        <a href="my-orders.html" class="list-group-item list-group-item-action active">
                            <i class="fas fa-shopping-cart me-2"></i>我的订单
                        </a>
                        <a href="reviews.html" class="list-group-item list-group-item-action">
                            <i class="fas fa-star me-2"></i>我的评价
                        </a>
                        <a href="#" class="list-group-item list-group-item-action" onclick="logout()">
                            <i class="fas fa-sign-out-alt me-2"></i>退出登录
                        </a>
                    </div>
                </div>
            </div>

            <!-- 主内容区 -->
            <div class="col-md-9">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-shopping-cart me-2"></i>我的订单</h5>
                    </div>
                    <div class="card-body">
                        <!-- 筛选器 -->
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <select class="form-select" id="statusFilter">
                                    <option value="">全部状态</option>
                                    <option value="PENDING">待支付</option>
                                    <option value="PAID">已支付</option>
                                    <option value="SHIPPED">已发货</option>
                                    <option value="COMPLETED">已完成</option>
                                    <option value="CANCELLED">已取消</option>
                                    <option value="REFUNDED">已退款</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <select class="form-select" id="orderTypeFilter">
                                    <option value="">全部类型</option>
                                    <option value="buyer">我购买的</option>
                                    <option value="seller">我售出的</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-outline-primary w-100" onclick="loadMyOrders()">
                                    <i class="fas fa-search me-1"></i>筛选
                                </button>
                            </div>
                        </div>

                        <!-- 订单列表 -->
                        <div id="ordersContainer">
                            <!-- 订单将通过JavaScript动态加载 -->
                        </div>
                        
                        <!-- 分页 -->
                        <nav aria-label="订单分页" class="mt-4">
                            <ul class="pagination justify-content-center" id="pagination">
                                <!-- 分页按钮将通过JavaScript动态生成 -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>校园二手交易平台</h5>
                    <p class="mb-0">让闲置物品重新焕发生机，让校园生活更加环保便捷。</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="mb-0">&copy; 2023 校园二手交易平台. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- 订单详情模态框 -->
    <div class="modal fade" id="orderDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">订单详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="orderDetailBody">
                    <!-- 订单详情内容 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" id="orderActionButton" style="display: none;">操作</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 评价模态框 -->
    <div class="modal fade" id="reviewModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">评价订单</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="reviewForm">
                        <input type="hidden" id="reviewOrderId">
                        <input type="hidden" id="reviewType">
                        <div class="mb-3">
                            <label for="reviewRating" class="form-label">评分 <span class="text-danger">*</span></label>
                            <div class="rating-input">
                                <input type="radio" name="rating" id="rating5" value="5" required>
                                <label for="rating5" class="star-label"><i class="far fa-star"></i></label>
                                <input type="radio" name="rating" id="rating4" value="4">
                                <label for="rating4" class="star-label"><i class="far fa-star"></i></label>
                                <input type="radio" name="rating" id="rating3" value="3">
                                <label for="rating3" class="star-label"><i class="far fa-star"></i></label>
                                <input type="radio" name="rating" id="rating2" value="2">
                                <label for="rating2" class="star-label"><i class="far fa-star"></i></label>
                                <input type="radio" name="rating" id="rating1" value="1">
                                <label for="rating1" class="star-label"><i class="far fa-star"></i></label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="reviewContent" class="form-label">评价内容 <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="reviewContent" rows="5" maxlength="500" placeholder="请输入评价内容（最多500字）" required></textarea>
                            <div class="form-text">
                                <span id="reviewContentCount">0</span>/500 字
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="submitReview()">提交评价</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/my-orders.js"></script>
</body>
</html>
