version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:13
    container_name: campus_trade_db
    environment:
      POSTGRES_DB: campus_trade
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./src/main/resources/sql/sample_data.sql:/docker-entrypoint-initdb.d/sample_data.sql
    networks:
      - campus_trade_network

  # Redis缓存（可选）
  redis:
    image: redis:6-alpine
    container_name: campus_trade_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - campus_trade_network

  # 应用服务
  app:
    build: .
    container_name: campus_trade_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campus_trade
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads
    networks:
      - campus_trade_network

volumes:
  postgres_data:
  redis_data:

networks:
  campus_trade_network:
    driver: bridge
