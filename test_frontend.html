<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试前端认证</title>
</head>
<body>
    <h1>测试前端认证</h1>
    <div id="status"></div>
    <div id="orders"></div>
    
    <script>
        // 模拟app对象
        const app = {
            API_BASE_URL: '/api',
            currentUser: () => currentUser,
            authToken: () => authToken,
            showMessage: (msg, type) => console.log(`${type}: ${msg}`)
        };
        
        let currentUser = null;
        let authToken = 'eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJjZXNoaSIsImV4cCI6MTc1OTEyOTkyNSwiaWF0IjoxNzU5MDQzNTI1fQ.aMN6fCCeArEfXTQPJXra365tNzE5hg8fykwiZAF2vibiHzrb-18ECLdnx8r8yjGpW4hLanR8Qb-AkMO1bLBXzg';
        
        // 测试获取用户信息
        function testAuth() {
            document.getElementById('status').innerHTML = '正在测试认证...';
            
            fetch(`${app.API_BASE_URL}/auth/me`, {
                headers: {
                    'Authorization': `Bearer ${authToken}`
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    currentUser = data.data;
                    document.getElementById('status').innerHTML = `认证成功: ${currentUser.username}`;
                    testOrders();
                } else {
                    document.getElementById('status').innerHTML = '认证失败';
                }
            })
            .catch(error => {
                document.getElementById('status').innerHTML = `认证错误: ${error.message}`;
            });
        }
        
        // 测试获取订单
        function testOrders() {
            document.getElementById('orders').innerHTML = '正在获取订单...';
            
            fetch(`${app.API_BASE_URL}/orders/my-orders?page=0&size=5`, {
                headers: {
                    'Authorization': `Bearer ${authToken}`
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('orders').innerHTML = `订单数量: ${data.data.content.length}`;
                } else {
                    document.getElementById('orders').innerHTML = '获取订单失败';
                }
            })
            .catch(error => {
                document.getElementById('orders').innerHTML = `获取订单错误: ${error.message}`;
            });
        }
        
        // 页面加载后自动测试
        window.onload = testAuth;
    </script>
</body>
</html>
