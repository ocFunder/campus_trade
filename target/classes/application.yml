server:
  port: 8080

spring:
  application:
    name: campus-second-hand-trade
  
  datasource:
    url: jdbc:postgresql://localhost:5432/campus_trade
    username: mri
    password: 
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  security:
    user:
      name: admin
      password: admin123

# JWT配置
jwt:
  secret: campusSecondHandTradeSecretKey2023
  expiration: 86400000 # 24小时

# 文件上传配置
file:
  upload:
    path: /Users/mri/Desktop/trade/uploads/

# 日志配置
logging:
  level:
    com.campus: DEBUG
    org.springframework.security: DEBUG
