<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的评价 - 校园二手交易平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-recycle me-2"></i>校园二手交易
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">商品浏览</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="publish.html">发布商品</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item" id="loginNav" style="display: none;">
                        <a class="nav-link" href="login.html">登录</a>
                    </li>
                    <li class="nav-item" id="registerNav" style="display: none;">
                        <a class="nav-link" href="register.html">注册</a>
                    </li>
                    <li class="nav-item dropdown" id="userNav" style="display: none;">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user me-1"></i><span id="username"></span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="profile.html">个人中心</a></li>
                            <li><a class="dropdown-item" href="my-products.html">我的商品</a></li>
                            <li><a class="dropdown-item" href="my-orders.html">我的订单</a></li>
                            <li><a class="dropdown-item" href="reviews.html">我的评价</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <div class="container mt-4">
        <div class="row">
            <!-- 侧边栏 -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-user me-2"></i>个人中心</h5>
                    </div>
                    <div class="list-group list-group-flush">
                        <a href="profile.html" class="list-group-item list-group-item-action">
                            <i class="fas fa-user me-2"></i>基本信息
                        </a>
                        <a href="my-products.html" class="list-group-item list-group-item-action">
                            <i class="fas fa-box me-2"></i>我的商品
                        </a>
                        <a href="my-orders.html" class="list-group-item list-group-item-action">
                            <i class="fas fa-shopping-cart me-2"></i>我的订单
                        </a>
                        <a href="reviews.html" class="list-group-item list-group-item-action active">
                            <i class="fas fa-star me-2"></i>我的评价
                        </a>
                        <a href="#" class="list-group-item list-group-item-action" onclick="logout()">
                            <i class="fas fa-sign-out-alt me-2"></i>退出登录
                        </a>
                    </div>
                </div>
            </div>

            <!-- 主内容区 -->
            <div class="col-md-9">
                <!-- 评价统计 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-chart-bar me-2"></i>评价统计</h5>
                    </div>
                    <div class="card-body">
                        <div class="row" id="reviewStats">
                            <!-- 评价统计将通过JavaScript动态加载 -->
                        </div>
                    </div>
                </div>

                <!-- 评价列表 -->
                <div class="card">
                    <div class="card-header">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="mb-0"><i class="fas fa-star me-2"></i>我的评价</h5>
                            <div class="btn-group" role="group">
                                <button type="button" class="btn btn-outline-primary btn-sm" id="receivedReviewsBtn" onclick="loadReceivedReviews()">
                                    收到的评价
                                </button>
                                <button type="button" class="btn btn-outline-primary btn-sm active" id="givenReviewsBtn" onclick="loadGivenReviews()">
                                    给出的评价
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <!-- 评价列表 -->
                        <div id="reviewsContainer">
                            <!-- 评价将通过JavaScript动态加载 -->
                        </div>
                        
                        <!-- 分页 -->
                        <nav aria-label="评价分页" class="mt-4">
                            <ul class="pagination justify-content-center" id="pagination">
                                <!-- 分页按钮将通过JavaScript动态生成 -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 评价详情模态框 -->
    <div class="modal fade" id="reviewDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">评价详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="reviewDetailBody">
                    <!-- 评价详情内容 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>校园二手交易平台</h5>
                    <p class="mb-0">让闲置物品重新焕发生机，让校园生活更加环保便捷。</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="mb-0">&copy; 2023 校园二手交易平台. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/reviews.js"></script>
</body>
</html>
