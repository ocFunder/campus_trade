<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园二手交易平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-recycle me-2"></i>校园二手交易
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">商品浏览</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="publish.html">发布商品</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item" id="loginNav" style="display: none;">
                        <a class="nav-link" href="login.html">登录</a>
                    </li>
                    <li class="nav-item" id="registerNav" style="display: none;">
                        <a class="nav-link" href="register.html">注册</a>
                    </li>
                    <li class="nav-item dropdown" id="userNav" style="display: none;">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user me-1"></i><span id="username"></span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="profile.html">个人中心</a></li>
                            <li><a class="dropdown-item" href="my-products.html">我的商品</a></li>
                            <li><a class="dropdown-item" href="my-orders.html">我的订单</a></li>
                            <li><a class="dropdown-item" href="reviews.html">我的评价</a></li>
                            <li id="adminNav" style="display: none;"><a class="dropdown-item" href="admin.html"><i class="fas fa-cogs me-2"></i>后台管理</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <div class="container mt-4">
        <!-- 搜索栏 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-8">
                                <div class="input-group">
                                    <input type="text" class="form-control" id="searchKeyword" placeholder="搜索商品...">
                                    <button class="btn btn-primary" type="button" onclick="searchProducts()">
                                        <i class="fas fa-search"></i> 搜索
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <select class="form-select" id="categoryFilter">
                                    <option value="">全部分类</option>
                                    <option value="ELECTRONICS">电子产品</option>
                                    <option value="BOOKS">图书教材</option>
                                    <option value="CLOTHING">服装配饰</option>
                                    <option value="SPORTS">运动用品</option>
                                    <option value="DAILY">生活用品</option>
                                    <option value="STUDY">学习用品</option>
                                    <option value="BEAUTY">美妆护肤</option>
                                    <option value="FOOD">食品饮料</option>
                                    <option value="OTHER">其他</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 商品分类 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-th-large me-2"></i>商品分类</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-2 col-sm-4 col-6 mb-3">
                                <a href="#" class="text-decoration-none" onclick="filterByCategory('ELECTRONICS')">
                                    <div class="category-item text-center p-3 border rounded">
                                        <i class="fas fa-laptop fa-2x text-primary mb-2"></i>
                                        <div>电子产品</div>
                                    </div>
                                </a>
                            </div>
                            <div class="col-md-2 col-sm-4 col-6 mb-3">
                                <a href="#" class="text-decoration-none" onclick="filterByCategory('BOOKS')">
                                    <div class="category-item text-center p-3 border rounded">
                                        <i class="fas fa-book fa-2x text-success mb-2"></i>
                                        <div>图书教材</div>
                                    </div>
                                </a>
                            </div>
                            <div class="col-md-2 col-sm-4 col-6 mb-3">
                                <a href="#" class="text-decoration-none" onclick="filterByCategory('CLOTHING')">
                                    <div class="category-item text-center p-3 border rounded">
                                        <i class="fas fa-tshirt fa-2x text-warning mb-2"></i>
                                        <div>服装配饰</div>
                                    </div>
                                </a>
                            </div>
                            <div class="col-md-2 col-sm-4 col-6 mb-3">
                                <a href="#" class="text-decoration-none" onclick="filterByCategory('SPORTS')">
                                    <div class="category-item text-center p-3 border rounded">
                                        <i class="fas fa-dumbbell fa-2x text-danger mb-2"></i>
                                        <div>运动用品</div>
                                    </div>
                                </a>
                            </div>
                            <div class="col-md-2 col-sm-4 col-6 mb-3">
                                <a href="#" class="text-decoration-none" onclick="filterByCategory('DAILY')">
                                    <div class="category-item text-center p-3 border rounded">
                                        <i class="fas fa-home fa-2x text-info mb-2"></i>
                                        <div>生活用品</div>
                                    </div>
                                </a>
                            </div>
                            <div class="col-md-2 col-sm-4 col-6 mb-3">
                                <a href="#" class="text-decoration-none" onclick="filterByCategory('STUDY')">
                                    <div class="category-item text-center p-3 border rounded">
                                        <i class="fas fa-pencil-alt fa-2x text-secondary mb-2"></i>
                                        <div>学习用品</div>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 热门商品 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-fire me-2"></i>热门商品</h5>
                        <a href="products.html" class="btn btn-sm btn-outline-primary">查看更多</a>
                    </div>
                    <div class="card-body">
                        <div class="row" id="popularProducts">
                            <!-- 热门商品将通过JavaScript动态加载 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 最新商品 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-clock me-2"></i>最新商品</h5>
                        <a href="products.html" class="btn btn-sm btn-outline-primary">查看更多</a>
                    </div>
                    <div class="card-body">
                        <div class="row" id="latestProducts">
                            <!-- 最新商品将通过JavaScript动态加载 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>校园二手交易平台</h5>
                    <p class="mb-0">让闲置物品重新焕发生机，让校园生活更加环保便捷。</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="mb-0">&copy; 2023 校园二手交易平台. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- 模态框 -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="productModalTitle">商品详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="productModalBody">
                    <!-- 商品详情内容 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" id="buyButton" onclick="buyProduct()">立即购买</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
