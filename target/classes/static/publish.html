<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-recycle me-2"></i>校园二手交易
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">商品浏览</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="publish.html">发布商品</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item" id="loginNav" style="display: none;">
                        <a class="nav-link" href="login.html">登录</a>
                    </li>
                    <li class="nav-item" id="registerNav" style="display: none;">
                        <a class="nav-link" href="register.html">注册</a>
                    </li>
                    <li class="nav-item dropdown" id="userNav" style="display: none;">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user me-1"></i><span id="username"></span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="profile.html">个人中心</a></li>
                            <li><a class="dropdown-item" href="my-products.html">我的商品</a></li>
                            <li><a class="dropdown-item" href="my-orders.html">我的订单</a></li>
                            <li><a class="dropdown-item" href="reviews.html">我的评价</a></li>

                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-plus-circle me-2"></i>发布新商品
                        </h4>
                    </div>
                    <div class="card-body">
                        <form id="publishForm" enctype="multipart/form-data">
                            <!-- 商品标题 -->
                            <div class="mb-3">
                                <label for="title" class="form-label">
                                    <i class="fas fa-tag me-1"></i>商品标题 <span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control" id="title" name="title" 
                                       placeholder="请输入商品标题" required maxlength="100">
                                <div class="form-text">简洁明了地描述您的商品</div>
                            </div>

                            <!-- 商品分类 -->
                            <div class="mb-3">
                                <label for="category" class="form-label">
                                    <i class="fas fa-list me-1"></i>商品分类 <span class="text-danger">*</span>
                                </label>
                                <select class="form-select" id="category" name="category" required>
                                    <option value="">请选择商品分类</option>
                                    <option value="ELECTRONICS">电子产品</option>
                                    <option value="BOOKS">图书教材</option>
                                    <option value="CLOTHING">服装配饰</option>
                                    <option value="SPORTS">运动健身</option>
                                    <option value="DAILY">生活用品</option>
                                    <option value="STUDY">学习用品</option>
                                    <option value="OTHER">其他</option>
                                </select>
                            </div>

                            <!-- 商品价格 -->
                            <div class="mb-3">
                                <label for="price" class="form-label">
                                    <i class="fas fa-yen-sign me-1"></i>商品价格 <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">¥</span>
                                    <input type="number" class="form-control" id="price" name="price" 
                                           placeholder="0.00" step="0.01" min="0" max="999999.99" required>
                                </div>
                                <div class="form-text">请输入合理的价格</div>
                            </div>

                            <!-- 商品描述 -->
                            <div class="mb-3">
                                <label for="description" class="form-label">
                                    <i class="fas fa-align-left me-1"></i>商品描述 <span class="text-danger">*</span>
                                </label>
                                <textarea class="form-control" id="description" name="description" 
                                          rows="5" placeholder="请详细描述您的商品，包括成色、使用情况、购买时间等信息" 
                                          required maxlength="1000"></textarea>
                                <div class="form-text">
                                    <span id="descCount">0</span>/1000 字符
                                </div>
                            </div>

                            <!-- 商品图片 -->
                            <div class="mb-3">
                                <label for="images" class="form-label">
                                    <i class="fas fa-images me-1"></i>商品图片
                                </label>
                                <input type="file" class="form-control" id="images" name="images" 
                                       accept="image/*" multiple>
                                <div class="form-text">支持 JPG、PNG 格式，最多上传 5 张图片</div>
                                
                                <!-- 图片预览区域 -->
                                <div id="imagePreview" class="mt-3" style="display: none;">
                                    <h6>图片预览：</h6>
                                    <div id="previewContainer" class="row"></div>
                                </div>
                            </div>

                            <!-- 联系方式 -->
                            <div class="mb-3">
                                <label class="form-label">
                                    <i class="fas fa-phone me-1"></i>联系方式
                                </label>
                                <div class="row">
                                    <div class="col-md-6">
                                        <input type="tel" class="form-control" id="phone" name="phone" 
                                               placeholder="手机号码">
                                    </div>
                                    <div class="col-md-6">
                                        <input type="email" class="form-control" id="email" name="email" 
                                               placeholder="邮箱地址">
                                    </div>
                                </div>
                                <div class="form-text">买家可以通过这些方式联系您</div>
                            </div>

                            <!-- 发布按钮 -->
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="button" class="btn btn-outline-secondary me-md-2" onclick="resetForm()">
                                    <i class="fas fa-undo me-1"></i>重置
                                </button>
                                <button type="submit" class="btn btn-primary" id="submitBtn">
                                    <i class="fas fa-paper-plane me-1"></i>发布商品
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 发布须知 -->
                <div class="card mt-4">
                    <div class="card-header">
                        <h6 class="mb-0">
                            <i class="fas fa-info-circle me-2"></i>发布须知
                        </h6>
                    </div>
                    <div class="card-body">
                        <ul class="mb-0">
                            <li>请确保商品信息真实有效，不得发布虚假信息</li>
                            <li>商品图片应清晰展示商品外观和成色</li>
                            <li>价格应合理，不得恶意哄抬或压低价格</li>
                            <li>禁止发布违禁物品或违法商品</li>
                            <li>发布后请及时回复买家的咨询</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 消息提示 -->
    <div id="messageContainer" class="position-fixed top-0 end-0 p-3" style="z-index: 1050;"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/publish.js"></script>
</body>
</html>
